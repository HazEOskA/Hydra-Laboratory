# Hermes tool registry.
#
# A tool is dispatchable only when `enabled: true` AND its health check passes.
# `permission_default` is the level for any action not listed under `actions`.
# Split verbs (`<verb>_permission`) let one tool carry two levels, e.g. an email
# draft is GREEN while sending is RED.
#
# Changing a level here changes what Hermes may do without asking OSA. Treat
# every edit as a security review: config/permissions matrix is generated from
# this file by `scripts/hermesctl permissions matrix`.

version: 1

tools:
  shell:
    enabled: true
    permission_default: GREEN
    description: Local shell inside the mission scope.
    timeout_seconds: 300
    retries: 1
    idempotent: false
    secrets: []
    health_check: "command -v bash"
    rollback: "no state change for read-only commands; destructive verbs are RED by pattern"
    actions:
      read: GREEN
      inspect: GREEN
      test: GREEN
      build: GREEN
      restart_service: YELLOW
      modify_firewall: YELLOW
      expose_public_port: RED
      delete_volume: RED

  docker:
    enabled: true
    permission_default: YELLOW
    description: Container lifecycle on the runtime host.
    timeout_seconds: 900
    retries: 2
    idempotent: false
    secrets: []
    health_check: "docker info"
    rollback: "redeploy the previous image id recorded in the rollback manifest"
    actions:
      ps: GREEN
      inspect: GREEN
      logs: GREEN
      build: YELLOW
      restart: YELLOW
      compose_up: YELLOW
      prune_volumes: RED
      delete_volume: RED

  git:
    enabled: true
    permission_default: GREEN
    description: Local repository operations.
    timeout_seconds: 300
    retries: 1
    idempotent: false
    secrets: []
    health_check: "git --version"
    rollback: "git reset --hard <recorded commit>"
    actions:
      status: GREEN
      diff: GREEN
      log: GREEN
      branch: GREEN
      commit: GREEN
      push: YELLOW
      force_push: RED
      delete_branch: YELLOW

  github:
    enabled: true
    permission_default: YELLOW
    description: Remote repository and pull-request operations.
    timeout_seconds: 300
    retries: 2
    idempotent: false
    secrets: [GITHUB_TOKEN]
    health_check: "gh auth status"
    rollback: "close the pull request; revert the pushed commit"
    actions:
      read_repo: GREEN
      read_pr: GREEN
      read_ci: GREEN
      push_branch: YELLOW
      open_pr: YELLOW
      merge_pr: RED
      delete_repo: RED

  filesystem:
    enabled: true
    permission_default: GREEN
    description: Read and write inside the mission working tree.
    timeout_seconds: 120
    retries: 1
    idempotent: true
    secrets: []
    health_check: "test -w ."
    rollback: "restore from the pre-change checkpoint"
    actions:
      read: GREEN
      write: GREEN
      backup: GREEN
      delete_persistent_volume: RED

  scheduler:
    enabled: true
    permission_default: YELLOW
    description: Cron, timers and recurring job configuration.
    timeout_seconds: 120
    retries: 1
    idempotent: true
    secrets: []
    health_check: "systemctl list-timers --all"
    rollback: "restore the previous schedule file and reload timers"
    actions:
      list: GREEN
      inspect: GREEN
      add_internal_job: GREEN
      change_schedule: YELLOW
      disable_job: YELLOW

  database:
    enabled: true
    permission_default: GREEN
    description: Mission, queue and revenue stores.
    timeout_seconds: 300
    retries: 2
    idempotent: false
    secrets: [DATABASE_URL]
    health_check: "sqlite3 :memory: 'select 1'"
    rollback: "restore the snapshot recorded in the rollback manifest"
    actions:
      read: GREEN
      query: GREEN
      backup: GREEN
      migrate_backward_compatible: YELLOW
      migrate_destructive: RED
      drop_production: RED

  browser:
    enabled: true
    permission_default: GREEN
    description: Headless browser for smoke tests and lawful public research.
    timeout_seconds: 300
    retries: 2
    idempotent: true
    secrets: []
    health_check: "test -x ${PLAYWRIGHT_CHROMIUM:-/opt/pw-browsers/chromium}"
    rollback: "read-only; no rollback required"
    actions:
      smoke_test: GREEN
      screenshot: GREEN
      fetch_public_page: GREEN
      submit_external_form: RED

  research:
    enabled: true
    permission_default: GREEN
    description: Lawful public-source research and enrichment.
    timeout_seconds: 300
    retries: 2
    idempotent: true
    secrets: [RESEARCH_API_KEY]
    health_check: "hermes_research_probe"
    rollback: "read-only; no rollback required"
    actions:
      search: GREEN
      enrich: GREEN
      summarize: GREEN

  telegram:
    enabled: true
    permission_default: YELLOW
    description: Operator notification channel to OSA.
    timeout_seconds: 60
    retries: 3
    idempotent: true
    secrets: [TELEGRAM_BOT_TOKEN]
    health_check: "hermes_telegram_probe"
    rollback: "delete the sent operator message"
    actions:
      notify_osa: YELLOW
      read_updates: GREEN
      message_external_recipient: RED

  email:
    enabled: true
    draft_permission: GREEN
    send_permission: RED
    description: Outreach drafting. Sending always requires scoped OSA approval.
    timeout_seconds: 120
    retries: 1
    idempotent: true
    secrets: [SMTP_URL]
    health_check: "hermes_email_probe"
    rollback: "drafts are local files and can be deleted; a sent email cannot be recalled"
    actions:
      draft: GREEN
      render_preview: GREEN
      send: RED
      send_bulk: RED

  deployment:
    enabled: true
    preview_permission: YELLOW
    production_permission: RED
    description: Preview and production releases.
    timeout_seconds: 1800
    retries: 1
    idempotent: false
    secrets: [DEPLOY_TOKEN]
    health_check: "hermes_deploy_probe"
    rollback: "redeploy the previous release recorded in the rollback manifest"
    actions:
      preview: YELLOW
      preview_teardown: YELLOW
      production: RED
      production_rollback: YELLOW

  payments:
    enabled: false
    permission_default: RED
    description: Disabled. No payment capability is wired in this baseline.
    timeout_seconds: 60
    retries: 0
    idempotent: false
    secrets: []
    health_check: "false"
    rollback: "not applicable while disabled"

  crypto:
    enabled: true
    analysis_permission: GREEN
    transaction_permission: RED
    description: Read-only market analysis. Transfers are RED and not wired.
    timeout_seconds: 120
    retries: 2
    idempotent: true
    secrets: []
    health_check: "hermes_crypto_probe"
    rollback: "analysis is read-only; a transfer cannot be reversed"
    actions:
      analysis: GREEN
      read_market: GREEN
      transaction: RED
      transfer: RED

# SOUL.md's RED list as reviewable patterns. These escalate a call regardless of
# the tool default — a GREEN tool cannot be used to smuggle a RED action through.
red_patterns:
  - id: red.external_recipient
    pattern: "\\b(send|outreach|cold_email|dm|direct_message)\\b.*\\b(external|prospect|customer|lead|recipient)\\b"
    permission: RED
  - id: red.public_publication
    pattern: "\\b(publish|post)\\b.*\\b(public|social|twitter|linkedin|x\\.com|blog)\\b"
    permission: RED
  - id: red.money_movement
    pattern: "\\b(charge|refund|payout|wire|transfer_funds|purchase|subscribe|billing)\\b"
    permission: RED
  - id: red.secret_rotation
    pattern: "\\brotate\\b.*\\b(secret|credential|api_key|token)\\b"
    permission: RED
  - id: red.destructive_delete
    pattern: "\\b(delete|drop|destroy|rm -rf)\\b.*\\b(repository|repo|production|database|volume|backup)\\b"
    permission: RED
  - id: red.public_exposure
    pattern: "\\b(expose|open|publish)\\b.*\\b(public port|0\\.0\\.0\\.0|dns|domain)\\b"
    permission: RED
  - id: red.disable_backups
    pattern: "\\bdisable\\b.*\\bbackup"
    permission: RED
  - id: red.auth_bypass
    pattern: "\\b(bypass|disable)\\b.*\\b(auth|authentication|2fa|mfa)\\b"
    permission: RED
  - id: red.unauthorized_system
    pattern: "\\b(exploit|bruteforce|scan)\\b.*\\b(third[- ]party|unauthorized|external host)\\b"
    permission: RED
  - id: red.impersonation
    pattern: "\\bimpersonat"
    permission: RED
