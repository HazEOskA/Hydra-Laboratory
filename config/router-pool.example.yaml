# Documentation-only copy of the current NVIDIA default-pool example.
# Source snapshot: NVIDIA/NemoClaw 24c73341394b84b887fbcfa9ec5028a7e6fadfb8.
# Do not apply this file during baseline installation. Validate the pool bundled
# with the installed release before proposing any Hydra changes.
routing:
  method: prefill
  checkpoint: llm-router/checkpoints/prefill_router_qwen08b.pt
  tolerance: 0.20
  encoder: Qwen/Qwen3.5-0.8B

models:
  - name: nano
    litellm_model: "openai/nvidia/Nemotron-3-Nano-30B-A3B"
    cost_per_m_input_tokens: 0.05
    api_base: "https://integrate.api.nvidia.com"

  - name: super
    litellm_model: "openai/nvidia/nemotron-3-super-120b-a12b"
    cost_per_m_input_tokens: 0.10
    api_base: "https://integrate.api.nvidia.com"
