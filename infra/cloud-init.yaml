#cloud-config
hostname: hydra-hermes-runtime-01
fqdn: hydra-hermes-runtime-01
manage_etc_hosts: true
timezone: UTC
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true
package_reboot_if_required: false

users:
  - default
  - name: hydra
    gecos: Hydra Hermes Runtime Operator
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

packages:
  - bash
  - binutils
  - ca-certificates
  - curl
  - docker.io
  - fail2ban
  - git
  - jq
  - openssh-server
  - python3
  - python3-venv
  - snapd
  - tar
  - ufw
  - unattended-upgrades
  - zstd

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h

  - path: /usr/local/sbin/hydra-firstboot
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      install -d -m 0700 -o hydra -g hydra /home/hydra/.ssh
      test -s /root/.ssh/authorized_keys
      awk '
        {
          for (i = 1; i <= NF; i++) {
            if ($i ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-|sk-ssh-|sk-ecdsa-)/) {
              for (j = i; j <= NF; j++) printf "%s%s", $j, (j == NF ? ORS : OFS)
              break
            }
          }
        }
      ' /root/.ssh/authorized_keys > /home/hydra/.ssh/authorized_keys
      test -s /home/hydra/.ssh/authorized_keys
      chown hydra:hydra /home/hydra/.ssh/authorized_keys
      chmod 0600 /home/hydra/.ssh/authorized_keys
      ssh-keygen -lf /home/hydra/.ssh/authorized_keys >/dev/null

      cat > /etc/ssh/sshd_config.d/99-hydra-hardening.conf <<'EOF'
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      AllowUsers hydra
      AllowTcpForwarding local
      AllowAgentForwarding no
      X11Forwarding no
      PermitTunnel no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      EOF
      sshd -t

      usermod -aG docker hydra
      systemctl enable --now docker
      docker info >/dev/null

      if snap list node >/dev/null 2>&1; then
        snap refresh node --channel=22
      else
        snap install node --classic --channel=22
      fi
      /snap/bin/node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>22 || (a===22 && b>=19) ? 0 : 1)'
      /snap/bin/npm --version >/dev/null

      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp comment 'SSH; Hetzner Cloud Firewall restricts source CIDRs'
      ufw --force enable

      systemctl enable --now fail2ban
      systemctl enable --now unattended-upgrades
      systemctl reload ssh

      install -d -m 0755 /var/lib/hydra-bootstrap
      date -u +%FT%TZ > /var/lib/hydra-bootstrap/complete

runcmd:
  - [/usr/local/sbin/hydra-firstboot]

final_message: "Hydra Hermes Hetzner baseline complete. Reboot if /var/run/reboot-required exists, reconnect as hydra, then run remote-preflight.sh."
