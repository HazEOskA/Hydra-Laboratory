api_version: hydra.osatech/v1
kind: HetznerCloudFirewallPolicy

metadata:
  name: hydra-hermes-runtime-01

apply_to:
  label_selectors:
    - project=hydra-hermes-lab
    - role=runtime

inbound:
  - description: ICMP for IPv4 diagnostics and path MTU discovery
    protocol: icmp
    source_cidrs: [0.0.0.0/0]
  - description: ICMPv6 diagnostics and neighbor/path MTU operation
    protocol: icmp
    source_cidrs: ["::/0"]

# Hetzner Cloud Firewalls allow all outbound traffic when no outbound rule exists.
# This is required during baseline for Ubuntu, Docker, NVIDIA, npm, and PyPI fetches.
outbound: []

must_not_be_public:
  - 22
  - 4000
  - 8642
  - 18789
