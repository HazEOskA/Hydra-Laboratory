name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: make syntax-check
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Parse YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load_file(f, aliases: true) }' \
            config/router-pool.example.yaml \
            infra/cloud-init.yaml \
            .github/workflows/validate.yml
      - name: Validate documentation
        run: make docs-check
      - name: Scan for secrets
        run: make secret-scan
      - name: Declare runtime boundary
        run: echo 'Static validation only; no NemoClaw runtime is claimed by CI.'
