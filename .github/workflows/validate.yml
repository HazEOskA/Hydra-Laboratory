name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: make syntax-check
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Parse YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load_file(f, aliases: true) }' \
            $(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -print)
      - name: Validate locked Hetzner infrastructure
        run: make infra-check tailscale-bootstrap-check remote-workflow-check
      - name: Validate documentation
        run: make docs-check
      - name: Scan for secrets
        run: make secret-scan
      - name: Declare runtime boundary
        run: echo 'Static validation only; no NemoClaw runtime is claimed by CI.'
